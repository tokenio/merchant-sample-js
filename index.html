<!DOCTYPE html>
<html>

<head>
    <title>Merchant Sample - Js</title>
    <link rel="stylesheet" type="text/css" href="/style.css" />
</head>

<body>
    <div class="buttonTypeSelector">
        Desktop mode:
        <input type="radio" id="buttonTypeRedirect" name="buttonTypeSelector" value="REDIRECT" checked />
        <label for="buttonTypeRedirect">Redirect (default)</label>
        <input type="radio" id="buttonTypeModal" name="buttonTypeSelector" value="MODAL" />
        <label for="buttonTypeModal">Modal</label>
        <input type="radio" id="buttonTypeIframe" name="buttonTypeSelector" value="IFRAME" />
        <label for="buttonTypeIframe">Iframe</label>
        <small>* Mobile is always redirect</small>
    </div>

    <button id="tokenModalBtn" class="CustomTokenButton">Pay By Bank</button>
    <div id="webapp-iframe"></div>
    <script src="https://app-sdk.token.io/2.0.8/token.min.js"></script>
    <script src="/client.js"></script>
</body>

</html>
